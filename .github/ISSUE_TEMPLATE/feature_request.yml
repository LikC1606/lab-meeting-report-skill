name: Feature request
description: Propose a broadly reusable improvement to the research reporting workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: workflow
    attributes:
      label: Research workflow
      description: What reporting task are you trying to complete?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you handle this today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only the implementation.
    validations:
      required: true

  - type: dropdown
    id: report-mode
    attributes:
      label: Affected report mode
      multiple: true
      options:
        - Research progress
        - Journal club or paper review
        - Mixed progress and literature
        - Feishu or Lark publishing
        - Installation or compatibility
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - General research workflow
        - Field-specific but reusable
        - Institution-specific
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Example or supporting context
      description: Use synthetic or anonymized material only.
